<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Third Frame Co · 第三帧事务所 — 免费可商用视频素材与照片素材库，提供各品牌相机 Log 灰片供调色练习使用。" />
    <title>Third Frame Co · 第三帧事务所</title>
    <script>
      // Prevent theme flash: apply theme before React mounts
      (function() {
        try {
          const stored = localStorage.getItem('tfc-theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const isDark = stored ? stored === 'dark' : prefersDark;
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
